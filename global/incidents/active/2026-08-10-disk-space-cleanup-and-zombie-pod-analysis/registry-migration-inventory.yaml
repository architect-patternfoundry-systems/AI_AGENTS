# Rollout Validation Rules
validation_rules:
  reject_if:
    - contains registry-bridge.tailc2cafc.ts.net
    - uses_latest_tag: true
    - missing_digest: true
    - unvalidated_registry: true
    - missing_rollback: true
    - inventory_totals_inconsistent: true
    - missing_audit_fields: true
    - rollback_uses_broken_registry: true
    - rollback_image_equals_new_image: true
  
  require:
    - node_crictl_pull_success: true
    - mirror_behavior_confirmed: true
    - transport_architecture_understood: true
    - rollback_artifact_available: true
    - rollback_image_local_registry_verified: true
    - rollback_image_differs_from_target: true
    - pod_running_and_ready: true
    - health_check_passed: true
    - imageID_contains_digest: true
    - cluster_discovery_matches_inventory: true

# Required Audit Fields for Completed Workloads
required_audit_fields:
  - old_image
  - new_image
  - rollback_image
  - rollback_available
  - rollback_reason
  - node_pull_verified
  - observed_image_id
  - rollout_duration_seconds
  - health_check_evidence
  - validation_timestamp

# Batch 1 Pre-Migration Gates
batch_1_pre_migration_gates:
  - Identify currently running image's exact imageID/digest before changing anything
  - Copy that exact image into 10.43.194.191:80 if not already there
  - Pull the resulting internal-registry digest using crictl
  - Store that distinct digest as rollback_image
  - Confirm rollback_image != new_image
  - Only then build and deploy the new digest-pinned image

# Batch 1 Execution Rules
batch_1_execution_rules:
  execution_mode: serial
  stop_condition: "Do not begin second rollout unless first service is Ready, has expected digest in imageID, has no unexpected restarts, and passes service-specific health check"
  inventory_update: "Update inventory transactionally after each service completion"
  health_check_gates:
    - pod_ready: true
    - imageID_contains_digest: true
    - restart_count: 0
    - service_health_check_passed: true
  rollback_verification:
    source_image_digest: sha256:<prior-known-good-digest>
    local_registry_pull_verified: true
    node_pull_verified:
      - cortex
    rollback_complete: false  # Reserved for actual rollback scenario

# Batch 1 Approval Sequence
batch_1_approval_sequence:
  status: planned_not_authorized
  authorization_required: true

  b1_a_artifact_and_rollback_evidence:
    status: pending
    required_fields:
      - workload: "gacs/telemetry-ingestor | gacs/span-processor"
      - current_image_reference: "<exact live and Git reference>"
      - target_image_reference: "<canonical repository@sha256 digest>"
      - target_manifest_preflight:
          status: 200
          returned_digest_matches: true
          media_type: "<value>"
      - target_pullability:
          eligible_nodes: []
          result_per_node: {}
      - rollback_image_reference: "<distinct canonical repository@sha256 digest>"
      - rollback_manifest_preflight:
          status: 200
          returned_digest_matches: true
      - rollback_pullability:
          eligible_nodes: []
          result_per_node: {}
      - registry_write_required: true|false
      - source_provenance: "<CI/source commit/build evidence>"
    approval_required: true

  b1_b_git_desired_state_change:
    status: pending
    prerequisite: b1_a_artifact_and_rollback_evidence_approved
    required_fields:
      - repository: "<exact repository>"
      - branch: "<new branch>"
      - exact_files: []
      - old_image: "<value>"
      - new_image: "<tag@sha256 digest>"
      - no_other_manifest_fields_changed: true
      - digest_policy_check: pass
      - review_required: true
      - flux_reconciliation: not_authorized
    approval_required: true

  b1_c_live_deployment_correction:
    status: pending
    prerequisite: b1_b_git_desired_state_change_approved
    required_fields:
      - cluster_context: "<exact context>"
      - namespace: gacs
      - resource: "<exact Deployment and container>"
      - expected_current_image: "<value>"
      - expected_resource_version: "<value>"
      - target_image: "<approved canonical tag@digest>"
      - replicas_behavior: "<must remain unchanged unless separately approved>"
      - rollout_behavior: "<explicit>"
      - validation: "<imageID, readiness, logs, rollback trigger>"
    approval_required: true

# Batch 1 Serial Stop Condition
batch_1_stop_condition:
  trigger:
    - target_digest_unavailable
    - target_or_rollback_pull_failure
    - image_reference_not_exact
    - unexpected_manifest_diff
    - resource_version_conflict
    - rollout_failure
    - runtime_imageID_mismatch
    - readiness_or_health_failure
    - rollback_artifact_unavailable
  effect:
    - do_not_start_next_workload
    - do_not_retry_with_modified_scope
    - capture_evidence
    - request_fresh_approval_for_remediation

# Completion Criteria
completion_criteria:
  all_workloads_migrated: false
  no_latest_tags: false
  all_digest_pinned: false
  no_imagepullbackoff: false
  all_nodes_validated: false
  rollback_references_recorded: false
  application_defects_classified: false
