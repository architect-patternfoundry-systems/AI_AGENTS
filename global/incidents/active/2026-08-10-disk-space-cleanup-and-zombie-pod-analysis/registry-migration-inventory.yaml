# Architecture Decision Record (ADR)
adr_decision:
  title: "Deliberate split transport for container registry access"
  decision_date: "2026-08-10T21:50:00Z"
  status: "approved"
  option: "A - Deliberate split transport"

  decision:
    node_runtime_pull_transport: >
      Continue using the K3s-configured internal HTTP mirror for node image pulls.
    external_operator_transport: >
      Use registry-bridge.tailc2cafc.ts.net via Tailscale HTTPS.
    artifact_identity: >
      Require canonical image repository references plus immutable sha256 digests
      for governed integration and future production workloads.
    registry_publishing_authority: >
      Explicitly out of scope for this ADR; requires a separate registry capability decision.
    internal_tls: deferred
    canonical_https_node_pulls: not_claimed

  rationale:
    - Existing three-node mirror configuration is consistent and operational.
    - Node pulls remain independent of Tailscale DNS and ProxyGroup availability.
    - Internal TLS/PKI and registry publisher authorization are separate capability investments.
    - Digest references preserve declared artifact identity despite mirror resolution.

  non_goals:
    - Claiming encrypted node-to-registry transport
    - Claiming registry publisher authentication
    - Claiming immutable tags or deletion protection
    - Migrating existing workload image references
    - Changing registries.yaml or restarting K3s

  compensating_controls:
    image_identity:
      integration_and_future_prod:
        required_format: "canonical-hostname/repository:tag@sha256:digest"
        reject:
          - ":latest"
          - "tilt-*"
          - "tag-only references"

    mirror_configuration:
      source_of_truth: "Git/OpenTofu/config-management"
      drift_detection:
        - hash registries.yaml across every node
        - alert on unreviewed differences
      service_identity:
        avoid: "hardcoded ClusterIP as long-term design dependency"
        future_state: "stable internal DNS endpoint or controlled service-discovery mechanism"

    network_boundary:
      registry_service:
        exposure: "cluster-internal only"
      kubernetes_network_policy:
        allow_registry_access_only_from_required_namespaces: true
      host_network:
        hardening: "restrict untrusted host access and node-level compromise"

    transport_claims:
      allowed_claim: "HTTPS protects external/operator registry access"
      prohibited_claim: "All node image pulls use HTTPS"

    artifact_recovery:
      retain:
        - current_verified_digest
        - previous_verified_digest
      verify:
        - pullability_from_every_node_runtime_class
        - digest_availability_before_rollout_approval

    supply_chain:
      deferred_separate_decision:
        - repository_scoped_ci_write_authority
        - immutable_tags
        - push_delete_audit_evidence
        - deletion_protection
        - artifact_provenance_enforcement

  decision_triggers:
    internal_network_untrusted:
      trigger: "Internal network becomes shared, untrusted, or reachable by guest/IoT devices"
      response: "Move to internal TLS or isolated registry network"
    sensitive_artifacts:
      trigger: "Sensitive or regulated artifact layers are introduced"
      response: "Move to internal TLS and authenticated registry access"
    clusterip_changes:
      trigger: "Registry ClusterIP changes or Service recreation breaks pulls"
      response: "Replace hard-coded IP endpoint with durable service identity"
    tailscale_dependency:
      trigger: "Nodes already require Tailscale for core cluster operations"
      response: "Reconsider canonical HTTPS node pulls"
    registry_upgrade:
      trigger: "A registry platform upgrade is selected"
      response: "Reassess internal TLS, repository authorization, immutability, audit, and retention together"
    cross_cluster_pulls:
      trigger: "Cross-cluster or remote-node pulls become common"
      response: "Prefer canonical HTTPS or an authenticated internal TLS endpoint"
    transport_integrity_incident:
      trigger: "A transport-integrity incident occurs"
      response: "Escalate to Option C design immediately"

  future_target:
    node_runtime: "authenticated internal TLS registry endpoint"
    operator_remote_client: "Tailscale HTTPS registry endpoint"
    ci: "repository-scoped authenticated publish endpoint"
    gitops: "canonical digest reference"
    admission: "release approval bound to exact digest/workload/environment"
    registry: "immutable publication and retained rollback artifacts"

